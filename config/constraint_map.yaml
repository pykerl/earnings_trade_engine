        date: "2026"
    crowded_names: [ASTS, RKLB]
    pure_plays:
      - {ticker: MTSI, name: "MACOM", exposure: "RF/microwave semis incl. space & defense share [FOR HUMAN REVIEW]", listing: US}
    diversified:
