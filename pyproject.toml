[project]
name = "earnings-trade-engine"
version = "0.1.0"
description = "Free-data earnings options dashboard (v1, per plan_free_weekend.md)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "lxml>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
